<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa da Jornada do Consumidor — 5 etapas interativas</title>
  <style>
body{font-family:Segoe UI,sans-serif;padding:20px;background:#f8fafc;color:#0f172a}h2{font-size:1.1rem;color:#0284c7;margin-bottom:14px}.etapas{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}.etapa{background:#fff;border:2px solid #cbd5e1;border-top:4px solid #0284c7;border-radius:10px;padding:14px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:4px}.etapa:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(2,132,199,.15)}.num{font-size:1.4rem;font-weight:900;color:#0284c7}.etapa strong{font-size:.88rem;color:#0f172a}.etapa small{font-size:.75rem;color:#64748b}.etapa:nth-child(2){border-top-color:#0891b2}.etapa:nth-child(3){border-top-color:#10b981}.etapa:nth-child(4){border-top-color:#7c3aed}.etapa:nth-child(5){border-top-color:#ec4899}.info{background:#e0f2fe;border-left:4px solid #0284c7;padding:12px 14px;border-radius:6px;font-size:.85rem;color:#0369a1;line-height:1.6}
  </style>
</head>
<body>
<h2>🗺️ Jornada do Consumidor</h2><div class="etapas"><div class="etapa" data-info="Consumidor reconhece o problema. Conteúdo ideal: artigos informativos, vídeos educativos, blog posts explicando o problema."><span class="num">1</span><strong>Conscientização</strong><small>Reconhece a necessidade</small></div><div class="etapa" data-info="Consumidor explora opções. Conteúdo ideal: comparativos de produtos, avaliações, tutoriais."><span class="num">2</span><strong>Consideração</strong><small>Compara soluções</small></div><div class="etapa" data-info="Consumidor decide. Conteúdo ideal: depoimentos, provas sociais, ofertas claras e garantias."><span class="num">3</span><strong>Decisão</strong><small>Escolhe e compra</small></div><div class="etapa" data-info="Consumidor avalia a experiência. Conteúdo ideal: guias de uso, suporte acessível, coleta de feedback."><span class="num">4</span><strong>Pós-Compra</strong><small>Avalia a experiência</small></div><div class="etapa" data-info="Consumidor vira defensor. Conteúdo ideal: programa de indicação, newsletter exclusiva, comunidade."><span class="num">5</span><strong>Lealdade e Advocacia</strong><small>Recomenda a marca</small></div></div><div class="info" id="infoEtapa">Clique em uma etapa para ver o que o consumidor sente e qual conteúdo é ideal.</div>
  <script>
document.querySelectorAll(".etapa").forEach(function(e){e.addEventListener("click",function(){document.getElementById("infoEtapa").textContent=e.dataset.info;});});
  </script>
</body>
</html>
