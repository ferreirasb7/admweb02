<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist SMART — verificação dos 5 componentes</title>
  <style>
body{font-family:Segoe UI,sans-serif;padding:20px;background:#f8fafc;color:#0f172a}h2{font-size:1.1rem;color:#0284c7;margin-bottom:14px}h3{font-size:.92rem;color:#0f172a;margin:14px 0 8px}.form{background:#fff;padding:12px;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:14px}.form label{display:block;font-size:.8rem;font-weight:700;margin-bottom:4px}.form input{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:5px;font-size:.85rem;font-family:inherit}.checks{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.chk{background:#fff;border:1px solid #cbd5e1;padding:10px 14px;border-radius:6px;font-size:.85rem;color:#334155;cursor:pointer;display:flex;gap:8px;align-items:center}.chk input{width:18px;height:18px;cursor:pointer;flex-shrink:0}.chk:hover{border-color:#0284c7;background:#f0f9ff}.barra-fundo{height:14px;background:#e2e8f0;border-radius:7px;overflow:hidden;margin-bottom:10px}.barra{height:100%;width:0%;background:linear-gradient(90deg,#f59e0b,#0284c7,#10b981);transition:width .3s}.resultado{background:#e0f2fe;border-left:4px solid #0284c7;padding:10px 14px;border-radius:6px;font-size:.84rem;font-weight:700;color:#0369a1}
  </style>
</head>
<body>
<h2>🎯 Checklist SMART</h2><div class="form"><label>Digite seu objetivo:</label><input type="text" id="inObj" value="Aumentar o tráfego orgânico do site em 25% nos próximos seis meses"></div><h3>Marque os componentes atendidos:</h3><div class="checks"><label class="chk"><input type="checkbox" id="c-s"> Específico (O quê? Quem? Onde? Por quê? Como?)</label><label class="chk"><input type="checkbox" id="c-m"> Mensurável (indicadores claros de sucesso)</label><label class="chk"><input type="checkbox" id="c-a"> Alcançável (recursos, tempo e capacidades)</label><label class="chk"><input type="checkbox" id="c-r"> Relevante (alinhado com missão e visão)</label><label class="chk"><input type="checkbox" id="c-t"> Com Prazo (data clara para atingir)</label></div><div class="barra-fundo"><div class="barra" id="barra"></div></div><div class="resultado" id="resultado">0 de 5 componentes marcados</div>
  <script>
function atualizar(){var ids=["c-s","c-m","c-a","c-r","c-t"];var n=0;ids.forEach(function(id){if(document.getElementById(id).checked)n++;});var pct=(n/5)*100;document.getElementById("barra").style.width=pct+"%";var r=document.getElementById("resultado");var obj=document.getElementById("inObj").value;if(n===5){r.textContent="✅ Objetivo SMART completo: \""+obj+"\"";r.style.background="#dcfce7";r.style.borderColor="#16a34a";r.style.color="#166534";}else{r.textContent=n+" de 5 componentes marcados";r.style.background="#e0f2fe";r.style.borderColor="#0284c7";r.style.color="#0369a1";}}["c-s","c-m","c-a","c-r","c-t"].forEach(function(id){document.getElementById(id).addEventListener("change",atualizar);});atualizar();
  </script>
</body>
</html>
